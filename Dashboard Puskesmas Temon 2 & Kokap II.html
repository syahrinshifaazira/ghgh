   card('w12',`Kelengkapan data pasien <span style="float:right;color:var(--tx)">Rata-rata ${avg.toFixed(1).replace('.',',')}% · ${N(l[0])} pasien</span>`,'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));column-gap:24px">'+p.fields.map((f,i)=>`<div class="row"><span>${f}</span><div class="bar"><i style="width:${l[i+1]}%;background:var(${l[i+1]>=90?'--g':l[i+1]>=60?'--c':'--r'})"></i></div><span class="n">${String(l[i+1]).replace('.',',')}%</span></div>`).join('')+'</div><div class="sub">Pasien yang berkunjung pada periode terpilih. Hijau ≥90%, kuning 60–89%, merah &lt;60%.</div>');
 }
}
function show(i){cur=i;[...$('tabs').children].forEach((b,j)=>b.setAttribute('aria-selected',String((i=='utama'&&j==0)||(i!='utama'&&j==i+1))));$('ttl').firstChild.nodeValue=i=='utama'?'Dashboard Puskesmas':'Puskesmas '+PK[i].nama;render();window.scrollTo(0,0)}
$('tabs').innerHTML='<button role="tab" aria-selected="true">Dashboard Utama</button>'+PK.map(p=>`<button role="tab" aria-selected="false">Puskesmas ${esc(p.nama)}</button>`).join('');
[...$('tabs').children].forEach((b,j)=>b.onclick=()=>show(j==0?'utama':j-1));
$('yr').innerHTML='<option value="all">Semua tahun</option>'+[...YS].reverse().map(t=>`<option>${t}</option>`).join('');
$('yr').onchange=render;render();
</script></body></html>
